<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Lexique - Layout</title>
  <link rel="stylesheet" href="lexique.css">
</head>

<body>
  <h1 class="activity-title">Place les objets de l’image dans les cases à droite.</h1>
  <div class="container">
    <!-- 左侧背景图 -->
    <div class="image-column">
      <div class="bg-wrapper">
        <img src="../../../assets/image/background.png" class="bg" alt="chambre" draggable="false">

        <!-- 书 cahier -->
        <div class="bg-target" id="t-cahier">
          <img src="../../../assets/image/cahier.png" draggable="true" class="draggable-img" id="img-cahier"
            data-word="cahier">
        </div>

        <!-- 橡皮 gomme -->
        <div class="bg-target" id="t-gomme">
          <img src="../../../assets/image/gomme.png" draggable="true" class="draggable-img" id="img-gomme"
            data-word="gomme">
        </div>

        <!-- 猫 chat -->
        <div class="bg-target" id="t-chat">
          <img src="../../../assets/image/chat.png" draggable="true" class="draggable-img" id="img-chat"
            data-word="chat">
        </div>

        <!-- 台灯 lampe -->
        <div class="bg-target" id="t-lampe">
          <img src="../../../assets/image/lamp.png" draggable="true" class="draggable-img" id="img-lampe"
            data-word="lampe">
        </div>

        <!-- 时钟 horloge -->
        <div class="bg-target" id="t-horloge">
          <img src="../../../assets/image/horloge.png" draggable="true" class="draggable-img" id="img-horloge"
            data-word="horloge">
        </div>
      </div>
    </div>

    <!-- 右侧：空框 + 单词 -->
    <div class="words-column">

      <div class="word-block">
        <div class="dropzone" data-word="cahier"></div>
        <div class="word word-cahier">cahier</div>
      </div>

      <div class="word-block">
        <div class="dropzone" data-word="gomme"></div>
        <div class="word word-gomme">gomme</div>
      </div>

      <div class="word-block">
        <div class="dropzone" data-word="chat"></div>
        <div class="word word-chat">chat</div>
      </div>

      <div class="word-block">
        <div class="dropzone" data-word="lampe"></div>
        <div class="word word-lampe">lampe</div>
      </div>

      <div class="word-block">
        <div class="dropzone" data-word="horloge"></div>
        <div class="word word-horloge">horloge</div>
      </div>

    </div>


  </div>
  <script src="lexique.js"></script>
</body>

</html>
